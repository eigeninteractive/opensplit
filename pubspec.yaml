name: opensplit
description: "Split expenses with friends. Free forever, no ads, works offline, open source."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  # Provides usePathUrlStrategy: real paths rather than hash fragments, which
  # Android App Links require.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  supabase_flutter: ^2.17.2
  google_sign_in: ^7.2.0
  share_plus: ^13.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  # Pinned to the 1.x line on purpose. dynamic_color 2.x depends on the
  # decoupled material_ui package, whose ColorScheme is a different type from
  # the one in package:flutter/material.dart — adopting it would mean migrating
  # every widget in the app off Flutter's own Material library.
  dynamic_color: ^1.9.0
  google_fonts: ^8.2.1
  web: ^1.1.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  test: ^1.31.1
  # Both are build-time generators, run by hand from the configs at the repo
  # root. Their inputs live in assets/icon/ and assets/splash/, which are
  # deliberately not bundled — nothing reads them at runtime.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Fonts, bundled rather than fetched.
  #
  # Flutter's web engine hardcodes a fallback font family, and it is not
  # optional. Both renderers do the same thing: if the font manifest contains no
  # family named "Roboto", they append one pointing at
  # fonts.gstatic.com/s/roboto/... and download it — see loadAssetFonts in
  # web_ui/.../skwasm_impl/font_collection.dart and canvaskit/fonts.dart. The
  # comment there gives the reason, and it is a good one: text laid out in an
  # unregistered family would otherwise crash, so there has to be something to
  # fall back to.
  #
  # It cares about the name and nothing else. So the name is declared, and it
  # points at the face this app actually uses. That is not a trick played on the
  # engine: the entry means "the family to fall back to", the engine spells that
  # "Roboto", and answering with Instrument Sans is more nearly correct than
  # shipping a second unrelated typeface would be — anything that falls through
  # lands on the app's own face instead of a stray Roboto. Nothing in this app
  # asks for "Roboto" by name.
  #
  # `assets:` is the separate mechanism package:google_fonts scans, and it is
  # how the brand faces are found. google_fonts registers them under its own
  # family names (InstrumentSans_regular and so on), so the declaration below
  # cannot collide with them even though it names the same file. With the files
  # present it resolves from the bundle, and allowRuntimeFetching is off in
  # main.dart so a packaging miss throws instead of reaching for the network.
  #
  # The brand faces need no `fonts:` entry of their own: google_fonts matches
  # them by filename, and these names are the ones it builds out of its own font
  # descriptors. Instrument Sans carries 400 and 500 for Material 3's type scale
  # plus 600, the one weight this app asks for by hand; JetBrains Mono carries
  # only the 500 that money amounts are set in. See docs/BRAND.md, and
  # assets/google_fonts/LICENSE for provenance.
  assets:
    - assets/google_fonts/
    # Only the mark, not the folder. The rest of assets/brand/ — the lockups,
    # the pre-stroked variants, the 1024px PNGs — are sources for generators and
    # for anything outside the app, and bundling them would ship a few hundred
    # kilobytes nothing reads. This one is tinted at runtime, so it is the only
    # variant the app needs. See BrandMark.
    - assets/brand/mark-mono.svg

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/InstrumentSans-Regular.ttf
          weight: 400
