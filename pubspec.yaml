name: opensplit
description: "Split expenses with friends. Free forever, no ads, works offline, open source."
repository: https://github.com/eigeninteractive/opensplit
issue_tracker: https://github.com/eigeninteractive/opensplit/issues
publish_to: "none"
# The version people see, and only that: change it with `dart run cider bump`,
# never by hand (see "Versions" in docs/runbook.md). There is no `+build`
# here on purpose. The release workflow numbers every build itself, and a
# number written here would only be a second, stale answer.
version: 2.0.0

environment:
  sdk: ^3.12.2

dependencies:
  # Runtime, not just tooling: the Google sign-in nonce is hashed for Google
  # and sent unhashed to the Worker.
  crypto: ^3.0.7
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  # Material, as a package rather than package:flutter/material.dart, which
  # Flutter has frozen and is removing. Its types are not the framework's, so
  # every dependency that hands one across (go_router, google_fonts,
  # dynamic_color) has to be on its material_ui release too.
  material_ui: ^1.5.0
  # Only for `flutter gen-l10n`, whose output imports it. The app takes its
  # Material localizations from material_ui instead; see app.dart.
  flutter_localizations:
    sdk: flutter
  # Provides usePathUrlStrategy: real paths rather than hash fragments, which
  # Android App Links require.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.2
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  google_sign_in: ^7.2.0
  # Named directly, unusually for an endorsed federated plugin, because the web
  # build imports `web_only.dart` from it: Google Identity Services will only
  # start a sign-in from a button it renders itself, and renderButton is not on
  # the cross-platform surface. See data/auth/google_button_web.dart.
  google_sign_in_web: ^1.1.3
  share_plus: ^13.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  dynamic_color: ^2.1.0
  google_fonts: ^9.0.0
  web: ^1.1.1
  flutter_svg: ^2.3.0
  in_app_update: ^5.0.0
  in_app_review: ^2.0.12
  connectivity_plus: ^7.3.1
  # Flutter's Cupertino localizations expose Cupertino icon data even though
  # the app uses Material widgets. Shipping the matching tree-shaken font
  # avoids missing glyphs in platform-adaptive framework surfaces.
  cupertino_icons: ^2.0.0
  package_info_plus: ^10.2.1
  # The API client, generated from docs/openapi.json by
  # `dart run tool/generate_api_client.dart`. A path dependency rather than a
  # folder under lib/, so generated code keeps its own lint posture instead of
  # forcing the app to relax its own to accommodate it.
  opensplit_api:
    path: packages/opensplit_api
  # Named directly as well as transitively, because this app configures it:
  # the base URL, the timeouts, and the interceptor that decides between a
  # bearer token and a cookie all live here rather than in the generated
  # client. Depending on a package you import is the rule that makes a
  # transitive bump unable to break you silently.
  dio: ^5.11.1
  # Names this device's IANA zone, which an expense records as where it
  # happened. Dart itself only gives abbreviations like "IST".
  flutter_timezone: ^5.1.0
  flutter_secure_storage: ^11.2.0
  characters: ^1.4.1
dev_dependencies:
  args: ^2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  freezed: ^4.0.1
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  test: ^1.31.1
  # Both are build-time generators, run by hand from the configs at the repo
  # root. Their inputs live in assets/icon/ and assets/splash/, which are
  # deliberately not bundled — nothing reads them at runtime.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  image: ^4.10.1
  # Keeps `version` above and CHANGELOG.md in step: `dart run cider log`,
  # `bump` and `release`. Here rather than globally activated, so everyone
  # runs the version pubspec.lock pins.
  cider: ^0.2.10

flutter:
  generate: true
  uses-material-design: true

  # Fonts, bundled rather than fetched.
  #
  # Flutter's web engine hardcodes a fallback font family, and it is not
  # optional. Both renderers do the same thing: if the font manifest contains no
  # family named "Roboto", they append one pointing at
  # fonts.gstatic.com/s/roboto/... and download it — see loadAssetFonts in
  # web_ui/.../skwasm_impl/font_collection.dart and canvaskit/fonts.dart. The
  # comment there gives the reason, and it is a good one: text laid out in an
  # unregistered family would otherwise crash, so there has to be something to
  # fall back to.
  #
  # It cares about the name and nothing else. So the name is declared, and it
  # points at the face this app actually uses. That is not a trick played on the
  # engine: the entry means "the family to fall back to", the engine spells that
  # "Roboto", and answering with Instrument Sans is more nearly correct than
  # shipping a second unrelated typeface would be — anything that falls through
  # lands on the app's own face instead of a stray Roboto. Nothing in this app
  # asks for "Roboto" by name.
  #
  # `assets:` is the separate mechanism package:google_fonts scans, and it is
  # how the brand faces are found. google_fonts registers them under its own
  # family names (InstrumentSans_regular and so on), so the declaration below
  # cannot collide with them even though it names the same file. With the files
  # present it resolves from the bundle, and allowRuntimeFetching is off in
  # main.dart so a packaging miss throws instead of reaching for the network.
  #
  # The brand face needs no `fonts:` entry of its own: google_fonts matches it
  # by filename, and these names are the ones it builds out of its own font
  # descriptors. Instrument Sans carries 400 and 500 for Material 3's type scale
  # plus 600, the one weight this app asks for by hand. Named file by file
  # because the folder also holds JetBrains Mono, which the static site and the
  # sign-in email set code in and the app does not use. See
  # assets/google_fonts/LICENSE for provenance.
  assets:
    - assets/google_fonts/InstrumentSans-Regular.ttf
    - assets/google_fonts/InstrumentSans-Medium.ttf
    - assets/google_fonts/InstrumentSans-SemiBold.ttf
    - assets/google_fonts/LICENSE
    # Only the mark, not the folder. The rest of assets/brand/ — the lockups,
    # the pre-stroked variants, the 1024px PNGs — are sources for generators and
    # for anything outside the app, and bundling them would ship a few hundred
    # kilobytes nothing reads. This one is tinted at runtime, so it is the only
    # variant the app needs. See BrandMark.
    - assets/brand/mark-mono.svg

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/InstrumentSans-Regular.ttf
          weight: 400

# cider's links in CHANGELOG.md. The release workflow tags each version as
# `v<version>` the first time a build of it ships.
cider:
  link_template:
    tag: https://github.com/eigeninteractive/opensplit/releases/tag/%tag%
    diff: https://github.com/eigeninteractive/opensplit/compare/%from%...%to%
    version: v%version%
