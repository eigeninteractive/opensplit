name: opensplit
description: "Split expenses with friends. Free forever, no ads, works offline, open source."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  # Provides usePathUrlStrategy: real paths rather than hash fragments, which
  # Android App Links require.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  # Direct dependency for the exchange-rate client. Already present
  # transitively via supabase_flutter, so this adds nothing to the build.
  http: ^1.6.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.9.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  supabase_flutter: ^2.17.2
  google_sign_in: ^7.2.0
  share_plus: ^13.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  test: ^1.31.1

flutter:
  uses-material-design: true
