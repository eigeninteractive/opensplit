name: opensplit
description: "Split expenses with friends. Free forever, no ads, works offline, open source."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  # Provides usePathUrlStrategy: real paths rather than hash fragments, which
  # Android App Links require.
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  supabase_flutter: ^2.17.2
  google_sign_in: ^7.2.0
  share_plus: ^13.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  # Pinned to the 1.x line on purpose. dynamic_color 2.x depends on the
  # decoupled material_ui package, whose ColorScheme is a different type from
  # the one in package:flutter/material.dart — adopting it would mean migrating
  # every widget in the app off Flutter's own Material library.
  dynamic_color: ^1.9.0
  google_fonts: ^8.2.1
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  test: ^1.31.1

flutter:
  uses-material-design: true

  # Roboto, bundled rather than fetched.
  #
  # Flutter's web engine does not ship a font: it registers Roboto from
  # https://fonts.gstatic.com and downloads it at startup. That is a request to
  # Google on every cold load of an app whose whole promise is that it works
  # offline and reports nothing, and until it lands every string on the page is
  # laid out in a substitute face and then reflowed.
  #
  # Declaring the family here takes precedence, so the engine uses these and
  # asks for nothing. 400 and 500 are the only weights Material 3's text theme
  # uses; there is no italic anywhere in this app.
  #
  # Copied from the Flutter SDK's own material_fonts artifacts. Roboto is
  # Apache 2.0 — see assets/google_fonts/LICENSE.
  #
  # The files live under assets/google_fonts/ and are declared twice, against
  # one copy on disk, because two different things have to be satisfied:
  #
  #  - `fonts:` is what the web engine reads. It is the only thing that stops
  #    it registering its own Roboto from fonts.gstatic.com.
  #  - `assets:` is what package:google_fonts scans. With the files present it
  #    resolves from the bundle, and allowRuntimeFetching is off in main.dart
  #    so a miss throws rather than quietly reaching for the network.
  assets:
    - assets/google_fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Roboto-Medium.ttf
          weight: 500
