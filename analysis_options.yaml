analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - vendor/**
    # The designer's brand kit, kept as delivered. Its lib/theme/*.dart are
    # reference implementations, not app code — what this project uses from
    # them now lives in lib/presentation/theme.dart.
    - brand/**

include: package:flutter_lints/flutter.yaml

# riverpod_lint's rules, which `dart analyze` runs like any other.
#
# Top-level rather than under `analyzer:`, and named by package rather than by
# host. The nested `analyzer: plugins: - custom_lint` form this replaces was the
# legacy plugin system, deprecated in Dart 3.13 and slated for removal -- which
# is what the "Support for legacy plugins is deprecated" warning was about.
#
# It had also gone stale in a way nothing reported. riverpod_lint moved to
# analysis_server_plugin, so it no longer ships through custom_lint at all, and
# custom_lint is not in pubspec.lock. The old entry therefore named a plugin
# that was not installed: every riverpod rule was present and silent, which is
# the exact failure the comment here used to describe having fixed.
#
# Restart the analysis server after changing this; the IDE does not pick it up
# on its own.
plugins:
  riverpod_lint:
    version: ^3.1.8

    # Rules turned off, and this map rather than `// ignore:` comments because
    # ignores do not work on plugin diagnostics. The analyzer parses them -- it
    # will even tell you an ignore is redundant -- and then reports the
    # diagnostic anyway, which is worth knowing before spending an afternoon
    # adding them. It is all or nothing per rule, so each of these is a
    # project-wide decision rather than a local exemption.
    diagnostics:
      # Off because it cannot be satisfied here, not because it is unwelcome.
      #
      # The rule exempts a ProviderScope written directly inside `runApp(...)`
      # or `pumpWidget(...)` -- it is a syntactic check on that adjacency, not a
      # judgement about whether anything is really scoped. Every widget test
      # here gets its scope from `signedInApp` in the test harness, so the
      # ProviderScope is one function call away from `pumpWidget` and the rule
      # sees a nested scope.
      #
      # Satisfying it would mean writing the override list out at every
      # pumpWidget in the suite, or declaring four app providers as scoped and
      # threading `dependencies` through the graph that reads them -- which
      # would describe a production scoping relationship that does not exist,
      # to quiet a warning about tests.
      #
      # What that costs: if this app ever does scope a provider for real, the
      # rule will not be there to ask for its dependencies.
      scoped_providers_should_specify_dependencies: false
