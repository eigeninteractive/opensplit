analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # The designer's brand kit, kept as delivered. Its lib/theme/*.dart are
    # reference implementations, not app code — what this project uses from
    # them now lives in lib/presentation/theme.dart. See docs/BRAND.md.
    - brand/**
include: package:flutter_lints/flutter.yaml
