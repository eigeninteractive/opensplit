# Regenerate with: dart run flutter_native_splash:create
#
# Colours here are ColorScheme values written out as literals, because none of
# this runs Dart — the same duplication the web splash has, and pinned the same
# way, by a test.
#
# #FCF8FF is ColorScheme.surface in the light scheme, #131318 in the dark.
# The brand kit quotes the light one as #FBF8FF; this is what
# ColorScheme.fromSeed actually produces, and the generated value is the one
# the app is built against.
flutter_native_splash:
  color: "#FCF8FF"
  color_dark: "#131318"
  image: assets/splash/splash-icon.png
  image_dark: assets/splash/splash-icon-dark.png

  # Android 12 replaced the full-bleed splash image with an icon in a masked
  # circle. splash-icon.png is 1152px with the mark at 640px specifically to
  # survive that crop.
  #
  # No icon_background_color: the mark sits directly on the surface, as it does
  # below Android 12 and on the web. A background is drawn in the launcher's
  # icon shape, which varies by manufacturer, and in a container colour too
  # close to the surface to read as deliberate.
  android_12:
    image: assets/splash/splash-icon.png
    image_dark: assets/splash/splash-icon-dark.png

  android: true
  android_gravity: center

  # No iOS target in this repo.
  ios: false

  # The web's splash is written by hand in web/index.html, as inline SVG so it
  # paints on the first round trip and fades out on Flutter's first frame.
  web: false
