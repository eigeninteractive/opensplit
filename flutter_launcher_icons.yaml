# Regenerate with: dart run flutter_launcher_icons
#
# Inputs live in assets/icon/ and are not bundled with the app — nothing reads
# them at runtime. See docs/BRAND.md for what each layer is and why the mark is
# sized the way it is.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "launcher_icon"
  min_sdk_android: 21
  # primaryContainer in the light scheme. A flat colour rather than an image
  # layer: the background of an adaptive icon is parallaxed and cropped by the
  # launcher, and there is nothing in this one that needs to survive that.
  adaptive_icon_background: "#E3DFFF"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"
  # Android 13+ themed icons, where the launcher recolours a monochrome layer to
  # the user's wallpaper palette.
  adaptive_icon_monochrome: "assets/icon/icon-monochrome.png"

  # Web icons come from here too, rather than being kept by hand. The concern
  # was the maskable variants — a launcher crops those to a circle 80% of the
  # icon's width, and this generator writes the maskable file as a byte-identical
  # copy of the plain one rather than padding it. Measured, though, the mark
  # spans 59% of the canvas, so it clears that mask with room to spare and the
  # copy is fine.
  #
  # This also rewrites web/manifest.json in place, keeping the fields it does not
  # own. background_color and theme_color are both ColorScheme.surface: the
  # browser paints theme_color immediately above the app bar, which sits on the
  # surface, so the primary that docs/BRAND.md suggests would draw a violet band
  # against a near-white bar. A test holds both against the running theme.
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FCF8FF"
    theme_color: "#FCF8FF"
