# Drift's own configuration, and it exists for exactly one reason.
#
# The sqlite module list is empty by default, so drift_dev cannot parse a
# `CREATE VIRTUAL TABLE ... USING fts5` at all — it reports the table as an
# element it could not find, which reads like a syntax error and is not one.
# That is very likely why the search index used to be raw SQL in database.dart
# rather than a declared table.
#
# The shape matters as much as the contents. `sqlite: modules:` is accepted by
# build_runner and then rejected outright by `drift_dev schema dump`, which
# refuses the `sqlite` field beside `sql` — so the two tools disagree about the
# same file unless everything goes under `sql.options`, as it does here.
targets:
  $default:
    builders:
      # The not_shared builder writes `database.drift.dart` as a plain part,
      # rather than a shared part that source_gen combines at the end. That is
      # what lets riverpod_generator see the row classes (`Group`, `Member`,
      # ...) that providers return: a shared part does not exist yet when
      # other part builders run.
      drift_dev:
        enabled: false
      drift_dev:analyzer:
        enabled: true
        options: &drift_options
          sql:
            dialect: sqlite
            options:
              # The floor for the syntax drift is allowed to generate, not a
              # requirement on the device: sqlite3_flutter_libs ships its own
              # newer library, and the browser gets one from the wasm bundle.
              version: "3.45"
              modules:
                - fts5
      drift_dev:not_shared:
        enabled: true
        options: *drift_options

global_options:
  drift_dev:not_shared:
    runs_before:
      - riverpod_generator
