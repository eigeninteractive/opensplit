version: 2

# The app, Worker and release tooling ship together. Batch routine updates so
# one merge runs the complete CI matrix and triggers one release.
multi-ecosystem-groups:
  routine-dependencies:
    schedule:
      interval: weekly

# Major upgrades are planned manually, outside the routine release batch.
# Security updates remain independent of the weekly version-update schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: routine-dependencies
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: bundler
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: routine-dependencies
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Dependabot calls pnpm's ecosystem `npm`. Include the service worker too;
  # its build dependencies were previously outside Dependabot's coverage.
  - package-ecosystem: npm
    directories:
      - /server
      - /service_worker
    patterns: ["*"]
    multi-ecosystem-group: routine-dependencies
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Keep the database toolchain on the reviewed rc.4 until its next
      # prerelease has been assessed explicitly. Stable 1.0 remains eligible.
      - dependency-name: drizzle-orm
        versions: [">=1.0.0-rc.5 <1.0.0"]
      - dependency-name: drizzle-kit
        versions: [">=1.0.0-rc.5 <1.0.0"]

  - package-ecosystem: pub
    directories:
      - /
      - /packages/opensplit_api
    patterns: ["*"]
    multi-ecosystem-group: routine-dependencies
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # This patch's dbus requirement conflicts with stable notifications.
      # Revisit with the notification and Android toolchain upgrade.
      - dependency-name: connectivity_plus
        versions: ["7.3.2"]
