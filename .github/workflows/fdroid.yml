name: F-Droid CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fdroid.yml'
      - '.github/workflows/release.yml'
      - 'fdroid/**'
      - 'android/**'
      # Cider writes app version bumps to pubspec.yaml. Watch the resolved
      # dependencies in pubspec.lock so version-only bumps skip this build.
      - 'pubspec.lock'
      - 'packages/**/pubspec.yaml'
      - 'packages/**/pubspec.lock'
      - 'lib/config.dart'
      - 'lib/main.dart'
      - 'lib/application/push_providers.dart'
      - 'lib/data/auth/**'
      - 'lib/data/platform/**'
      - 'lib/data/push/**'
      - 'lib/presentation/app.dart'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check the F-Droid APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_VERSION_CODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the release Flutter version
        id: flutter
        run: |
          version="$(awk -F '"' '/^[[:space:]]*flutter-version:/ { print $2; exit }' .github/workflows/release.yml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install the Android build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'

      - name: Prepare the F-Droid sources and resolve dependencies
        run: |
          cp pubspec.lock "$RUNNER_TEMP/opensplit-lock-before-fdroid.yaml"
          bash fdroid/prepare.sh
          flutter pub get

      - name: Check F-Droid dependency pins
        run: |
          ruby -ryaml - "$RUNNER_TEMP/opensplit-lock-before-fdroid.yaml" pubspec.lock <<'RUBY'
          original, fdroid = ARGV.map { |path| YAML.safe_load(File.read(path)).fetch('packages') }
          forbidden = /\A(?:_flutterfire_internals|firebase_.*|google_identity_services_web|google_sign_in(?:_.*)?|in_app_(?:update|review)(?:_.*)?|flutter_local_notifications(?:_.*)?)\z/
          pins = %w[source version description]
          problems = fdroid.map do |name, package|
            if forbidden.match?(name)
              "Store-only dependency resolved for F-Droid: #{name}"
            elsif original[name]&.slice(*pins) != package.slice(*pins)
              "F-Droid resolved a different version or source for #{name}"
            end
          end.compact
          abort problems.join("\n") unless problems.empty?
          puts "All #{fdroid.size} resolved packages match the shared lockfile pins."
          RUBY

      - name: Build an unsigned APK
        run: bash fdroid/build.sh "$TEST_VERSION_CODE"

      - name: Verify the APK and Android dependency graph
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools="$ANDROID_HOME/build-tools/37.0.0"
          version="$(ruby -ryaml -e 'puts YAML.safe_load(File.read("pubspec.yaml")).fetch("version")')"
          badging="$("$tools/aapt2" dump badging "$apk")"
          grep -F "package: name='com.eigeninteractive.opensplit' versionCode='$TEST_VERSION_CODE' versionName='$version'" <<< "$badging"
          grep -F "uses-permission: name='android.permission.INTERNET'" <<< "$badging"
          if grep -E 'POST_NOTIFICATIONS|com\.google\.android\.c2dm' <<< "$badging"; then
            echo 'The F-Droid APK requests a push notification permission.' >&2
            exit 1
          fi
          test -x "$tools/apksigner"
          if verification="$("$tools/apksigner" verify "$apk" 2>&1)"; then
            echo 'The F-Droid APK is signed.' >&2
            exit 1
          fi
          grep -F 'Missing META-INF/MANIFEST.MF' <<< "$verification"

          (cd android && ORG_GRADLE_PROJECT_fdroid=true ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath --console=plain) > "$RUNNER_TEMP/fdroid-gradle-dependencies.txt"
          if grep -E 'com\.google\.(android\.(gms|play)|firebase):|com\.android\.billingclient:' \
            "$RUNNER_TEMP/fdroid-gradle-dependencies.txt"; then
            echo 'The F-Droid Android runtime includes a Google store SDK.' >&2
            exit 1
          fi

          python3 - "$apk" <<'PYTHON'
          import re
          import sys
          from zipfile import ZipFile

          store_class = re.compile(
              rb"Lcom/(?:google/(?:android/(?:gms|play)|firebase)|android/billingclient)/"
          )
          with ZipFile(sys.argv[1]) as apk:
              dex_files = [name for name in apk.namelist() if re.fullmatch(r"classes\d*\.dex", name)]
              if not dex_files:
                  raise SystemExit("APK contains no DEX files.")
              for name in dex_files:
                  match = store_class.search(apk.read(name))
                  if match:
                      raise SystemExit(f"Store SDK classes found in {name}: {match.group().decode()}")
          print("F-Droid APK contains no Firebase or Google Play SDK classes.")
          PYTHON
