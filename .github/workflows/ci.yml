name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos

      # The Supabase integration tests skip themselves when nothing is
      # listening, so this stays green without a backend.
      - run: flutter test

      # The domain runs on the web too, where an int is a double. The
      # allocator's BigInt intermediates exist for this and nothing else
      # proves them.
      - run: flutter test --platform chrome test/domain

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start
      # Invariant trigger, RLS non-recursion, invite claim flow.
      - run: supabase test db

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build web --wasm --release
      - run: flutter build apk --debug
