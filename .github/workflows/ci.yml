name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dart:
    name: Analyse and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Regenerate committed database contracts
        run: |
          dart run drift_dev schema dump lib/data/local/database.dart drift_schemas/
          dart run drift_dev schema generate drift_schemas/ test/data/generated_migrations/
          dart format test/data/generated_migrations
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check automatic fixes and generated contract drift
        run: |
          for directory in lib test tool; do dart fix --apply "$directory"; done
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: flutter analyze --fatal-infos --no-pub
      - run: flutter test --exclude-tags integration
      - run: flutter test --platform chrome test/domain
      - name: Check tools did not mutate the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  database:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true
      - run: supabase start
      - run: supabase test db
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      # Never let the adapter tests silently pass without their database.
      - run: flutter test --dart-define=REQUIRE_SUPABASE=true test/data/supabase_integration_test.dart
      - if: always()
        run: supabase stop --no-backup

  tooling:
    name: Release tooling and Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
      - run: node --test test/web_service_worker_test.mjs
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ruby -c fastlane/Fastfile
      - run: bundle exec fastlane lanes
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: deno fmt --check supabase/functions
      - run: deno check --config=supabase/functions/deno.json supabase/functions/fetch-fx/index.ts supabase/functions/notify-entry/index.ts
      - name: Check tools did not mutate the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart run tool/build_web.dart --config=env/ci.example.json
      # No upload credentials enter PR jobs; this is a compile check, not a release.
      - run: flutter build apk --release --dart-define-from-file=env/ci.example.json
