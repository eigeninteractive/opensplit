name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dart:
    name: Analyse and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Regenerate committed database contracts
        run: |
          dart run drift_dev schema dump lib/data/local/database.dart drift_schemas/
          dart run drift_dev schema generate drift_schemas/ test/data/generated_migrations/
          dart format test/data/generated_migrations
      # The API client is generated from docs/openapi.json and committed, so a
      # wire change that skipped the regeneration is caught here rather than on
      # a device. Needs a JDK, which the runner image already carries.
      - name: Check the generated API client against the contract
        run: dart run tool/generate_api_client.dart --check
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Check automatic fixes and generated contract drift
        run: |
          for directory in lib test tool; do dart fix --apply "$directory"; done
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      # `dart analyze`, not `flutter analyze`. They are the same analyzer, but
      # only the former loads the plugins named in analysis_options.yaml -- so
      # every riverpod_lint rule was being skipped here while passing locally
      # in an IDE that does load them.
      - run: dart analyze --fatal-infos
      - run: flutter test --exclude-tags integration
      - name: Test domain logic and refresh UI in Chrome
        run: >-
          flutter test --platform chrome test/domain
          test/presentation/sync_refresh_test.dart
          test/presentation/sync_status_test.dart
      - name: Test browser database synchronization
        run: |
          cp web/sqlite3.wasm web/drift_worker.js test/browser/
          flutter test --platform chrome --wasm --cross-origin-isolation test/browser
      - name: Check tools did not mutate the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  backend:
    name: Backend and adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The Durable Object and the routes, against workerd. Fast, and where
      # most of the server's behaviour is actually pinned down.
      - run: npm test
      # The Worker serves the front end as well as the API, so it will not
      # start at all without an assets directory -- wrangler refuses outright
      # rather than serving nothing.
      #
      # The real client, not `--site-only`, and the couple of minutes it costs
      # buys the one property nothing else here covers: that a cold deep link
      # into /app arrives cross-origin isolated. That request is answered by
      # the Worker rather than the asset router, so whether `_headers` reaches
      # it is a fact about the two of them together, and losing it means the
      # client's database quietly stops working in browsers. The web bundle
      # job builds the same thing in parallel; coupling the two jobs to share
      # it would put that job's whole duration on this one's critical path.
      - name: Build the front end the Worker serves
        working-directory: .
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
          dart run tool/build_web.dart --config=env/ci.example.json
      # And then the one test that goes near the wire. `wrangler dev` runs the
      # real Worker over local D1, KV and Durable Object storage -- nothing
      # here touches a Cloudflare account, and no credentials are needed.
      - name: Start the Worker
        run: |
          cp .dev.vars.example .dev.vars
          npm run db:migrate:local
          # --test-scheduled exposes the cron handler, which the step below
          # uses to publish exchange rates. Without it the adapter's rate
          # assertions skip themselves against an empty KV namespace.
          npx wrangler dev --port 8787 --test-scheduled &
          timeout 120 bash -c \
            'until curl -sf http://127.0.0.1:8787/api/health >/dev/null; do sleep 1; done'
      # Reaches the real ECB feed, which is the one thing no stub can check:
      # whether the adapter still parses what the provider actually sends. A
      # failure here is not fatal — the rate tests skip when nothing was
      # published, because somebody else's outage is not our regression.
      - name: Publish exchange rates
        continue-on-error: true
        run: |
          curl -sS --max-time 60 \
            'http://127.0.0.1:8787/cdn-cgi/handler/scheduled?cron=0+4+*+*+*'
      - name: Test the adapter against it
        working-directory: .
        run: |
          # REQUIRE_BACKEND, so this can never quietly skip itself in CI --
          # which is the only failure mode an opt-in integration test has.
          flutter test --dart-define=REQUIRE_BACKEND=true \
            test/data/cloudflare_integration_test.dart

  tooling:
    name: Release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
      - run: node --test test/web_service_worker_test.mjs
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ruby -c fastlane/Fastfile
      - run: bundle exec fastlane lanes
      - name: Check tools did not mutate the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  build:
    name: Web bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      # The web bundle only. Android used to be compiled here too, as a release
      # APK, and it was by a wide margin the slowest thing in CI — a whole
      # Gradle and NDK toolchain, stood up to prove something release proves
      # again minutes later. Release calls this workflow and then builds the
      # signed bundle from the same commit, and it deploys nothing if that
      # fails, so main is never published from a tree Android cannot build.
      #
      # This job exists for pull requests, where release does not run and this
      # is the only compile check there is. That is also exactly what dropping
      # the APK costs: an Android-only break now surfaces on the push to main
      # rather than on the pull request that introduced it.
      - run: dart run tool/build_web.dart --config=env/ci.example.json
