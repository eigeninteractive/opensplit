name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  dart:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: dart analyze --fatal-infos
      - run: node --test test/web_service_worker_test.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3
      - run: deno fmt --check supabase/functions
      - run: deno check supabase/functions/fetch-fx/index.ts
      - run: deno check supabase/functions/notify-entry/index.ts

      # The Supabase integration tests skip themselves when nothing is
      # listening, so this stays green without a backend.
      - run: flutter test

      # The domain runs on the web too, where an int is a double. The
      # allocator's BigInt intermediates exist for this and nothing else
      # proves them.
      - run: flutter test --platform chrome test/domain

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - run: supabase start
      # Invariant trigger, RLS non-recursion, invite claim flow, and what a
      # modified client can do to another member of its own group.
      - run: supabase test db

      # The adapter against the real thing. These skip themselves when nothing
      # is listening, which is why the `dart` job above stays green without a
      # backend — and is also why they have to be run somewhere that DOES have
      # one, or they never run at all. They are the only thing that catches a
      # wrong RPC signature, a PostgREST filter that does not mean what it
      # looks like, or a policy that forbids something the app has to do.
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter test test/data/supabase_integration_test.dart

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart run tool/build_web.dart --config=env/ci.example.json
      - run: flutter build apk --release --dart-define-from-file=env/ci.example.json
