name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Firebase and Play (uncheck for first-upload artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: CI checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and distribute
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    # Do not interrupt uploads or allow overlapping Play/Hosting releases.
    concurrency:
      group: opensplit-release-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
      FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
      - run: npm install --global firebase-tools@15.28.2
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: Write public app configuration
        env:
          APP_VARIABLES: ${{ toJSON(vars) }}
        # Only these public identifiers enter the client, never the whole env.
        run: |
          printf '%s' "$APP_VARIABLES" | jq '{
            SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, LINK_HOST,
            GOOGLE_WEB_CLIENT_ID, FCM_PROJECT_ID, FCM_SENDER_ID,
            FCM_VAPID_KEY, ANDROID_FCM_API_KEY, ANDROID_FCM_APP_ID,
            WEB_FCM_API_KEY, WEB_FCM_APP_ID
          }' > env/app.json
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart run tool/build_web.dart
      - name: Install Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Upload key is missing}" \
            | base64 --decode > "$RUNNER_TEMP/opensplit-upload.jks"
          test -s "$RUNNER_TEMP/opensplit-upload.jks"
      - name: Build signed Android bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/opensplit-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # Reserve two digits for retries so every attempt gets a new code.
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( GITHUB_RUN_ATTEMPT > 99 || version_code > 2100000000 )); then
            echo 'Android version code or retry limit exceeded.' >&2
            exit 1
          fi
          flutter build appbundle --release --dart-define-from-file=env/app.json \
            --build-number="$version_code" --split-debug-info=build/debug-info/android
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Check packaging did not mutate source
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v7
        with:
          name: opensplit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/web
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release
            build/debug-info/android
          if-no-files-found: error
          retention-days: 30

      # Mint short-lived credentials only AFTER builds and artifact uploads.
      - name: Recheck current main before deployment
        if: github.event_name == 'push' || inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Authenticate to Firebase Hosting (keyless)
        if: github.event_name == 'push' || inputs.deploy
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Deploy live Firebase Hosting
        if: github.event_name == 'push' || inputs.deploy
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          firebase target:apply hosting main-site "${FIREBASE_HOSTING_SITE:?Hosting site is missing}" \
            --project "${FIREBASE_PROJECT_ID:?Firebase project is missing}" --non-interactive
          firebase deploy --only hosting:main-site --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Authenticate to Google Play (keyless)
        if: github.event_name == 'push' || inputs.deploy
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Distribute to Play internal testing
        if: github.event_name == 'push' || inputs.deploy
        env:
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: bundle exec fastlane android internal
      - name: Remove temporary upload key
        if: always()
        run: rm -f -- "${RUNNER_TEMP:?}/opensplit-upload.jks"
