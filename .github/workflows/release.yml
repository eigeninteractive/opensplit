name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare and Play (uncheck for first-upload artifacts only)
        type: boolean
        default: false
      update_priority:
        description: >-
          Play in-app update priority, 0-5. The app can offer an immediate
          update at 4 or above when Play makes it available and permits the
          flow. Use 4 for breaking releases; priority alone does not block
          clients or protect data during review or installation.
        type: choice
        default: "0"
        options: ["0", "1", "2", "3", "4", "5"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: CI checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and distribute
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    # Do not interrupt uploads or allow overlapping Play/Worker releases.
    concurrency:
      group: opensplit-release-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.build.outputs.version }}
    env:
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/package.json
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            service_worker/pnpm-lock.yaml
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true

      # Before the slow build, so a release that cannot land fails in seconds.
      # Wrangler binds to whatever id the config names without checking it
      # exists, so a deploy to the committed placeholders would succeed, pass
      # the health check below (which touches neither D1 nor KV), and fail on
      # the first real request.
      - name: Refuse to deploy to placeholder resources
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm check:deploy-config

      - name: Write public app configuration
        env:
          APP_VARIABLES: ${{ toJSON(vars) }}
        # Only these public identifiers enter the client, never the whole env.
        run: |
          printf '%s' "$APP_VARIABLES" | jq '{
            API_BASE_URL, LINK_HOST,
            GOOGLE_WEB_CLIENT_ID, FCM_PROJECT_ID, FCM_SENDER_ID,
            FCM_VAPID_KEY, ANDROID_FCM_API_KEY, ANDROID_FCM_APP_ID,
            WEB_FCM_API_KEY, WEB_FCM_APP_ID
          }' > env/app.json
      - run: flutter pub get --enforce-lockfile
      # One number for the whole release, given to the web bundle and the
      # Android bundle alike, so About shows the same "1.2.0 (1701)" on both.
      # The version name is pubspec.yaml's, set with cider; see "Versions" in
      # docs/runbook.md.
      - name: Number this build
        id: build
        run: |
          # Run number times 100, plus the attempt: it only ever goes up, and a
          # retry gets a new number, which Play insists on. GitHub numbers runs
          # per workflow file, so renaming this file starts again from 1, below
          # codes Play has already seen; see the runbook before doing that.
          number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( GITHUB_RUN_ATTEMPT > 99 || number > 2100000000 )); then
            echo 'Android version code or retry limit exceeded.' >&2
            exit 1
          fi
          version="$(dart run cider version)"
          test -n "$version"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version ($number)."
      # Before the slow build, so a changelog Play would refuse fails in
      # seconds. Package the notes and artwork into the runner's temporary
      # directory, leaving the checkout and generated screenshots untouched.
      - name: Prepare the Play listing and release notes
        run: |
          dart run tool/play_metadata.dart --output="$RUNNER_TEMP/play-metadata"
          cat "$RUNNER_TEMP/play-metadata/en-US/changelogs/default.txt"
      - run: dart run build_runner build
      - name: Build the web bundle
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: dart run tool/build_web.dart --build-number="$BUILD_NUMBER"
      - name: Install Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Upload key is missing}" \
            | base64 --decode > "$RUNNER_TEMP/opensplit-upload.jks"
          test -s "$RUNNER_TEMP/opensplit-upload.jks"
      - name: Build signed Android bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/opensplit-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          flutter build appbundle --release --dart-define-from-file=env/app.json \
            --build-number="$BUILD_NUMBER" --split-debug-info=build/debug-info/android
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Check packaging did not mutate source
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v7
        with:
          name: opensplit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/web
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release
            build/debug-info/android
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: opensplit-play-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/play-metadata
          if-no-files-found: error
          retention-days: 30

      # Mint short-lived credentials only AFTER builds and artifact uploads.
      - name: Recheck current main before deployment
        if: github.event_name == 'push' || inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      # One step, one version: the Worker script and everything in build/web go
      # up together and become live together. That is the reason the bundle is
      # built in this job rather than deployed from somewhere else. Already open
      # web tabs and installed Android builds can still use an older contract;
      # API retirement and client update handling must account for those.
      #
      # The Worker, the D1 database, the KV namespace and the custom domain all
      # have to exist already; see docs/runbook.md. Creating them is
      # not something a push to main should be able to do.
      #
      # `pnpm exec wrangler`, the version pnpm-lock.yaml pins: the same one CI
      # just ran the suite against. Wrangler owns the Durable Object `exports`
      # map and the D1 migration state, so it is part of what is being released,
      # not a transport.
      #
      # D1 first, then the Worker, so the code never starts against a schema
      # older than it expects. Wrangler applies only what it has not recorded as
      # applied, and confirms by itself outside a terminal. The Durable Objects
      # migrate themselves, lazily, on first open; see docs/runbook.md.
      - name: Apply the D1 migrations
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply opensplit --remote
      - name: Deploy the Worker and the web bundle
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""
      - name: Check the deployment is answering
        if: github.event_name == 'push' || inputs.deploy
        env:
          LINK_HOST: ${{ vars.LINK_HOST }}
        run: |
          # Deploys are eventually consistent across the edge, so this retries
          # rather than asserting once. A release that uploaded and then does
          # not answer is worth failing the run over.
          for attempt in $(seq 1 30); do
            if curl -sf "https://${LINK_HOST:?Link host is missing}/api/health" \
              | grep -q '"service":"opensplit"'; then
              exit 0
            fi
            sleep 4
          done
          echo "The deployed Worker did not answer /api/health." >&2
          exit 1
      - name: Authenticate to Google Play (keyless)
        if: github.event_name == 'push' || inputs.deploy
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Submit to Play production
        if: github.event_name == 'push' || inputs.deploy
        env:
          # Play's 0-5 in-app update priority, set per release and only
          # settable through the Publishing API. The installed app chooses the
          # update flow; priority alone cannot force installation or block use.
          PLAY_UPDATE_PRIORITY: ${{ inputs.update_priority || '0' }}
          # Written above, from CHANGELOG.md and the committed artwork.
          # en-US is the store listing's language; images affect the listing
          # across tracks. The production lane fixes the destination and full
          # rollout status; Play review and managed publishing still apply.
          PLAY_METADATA_DIR: ${{ runner.temp }}/play-metadata
        run: bundle exec fastlane android production
      - name: Remove temporary upload key
        if: always()
        run: rm -f -- "${RUNNER_TEMP:?}/opensplit-upload.jks"

  # Its own job so that only this step can write to the repository: the job
  # that builds and deploys keeps read-only contents.
  tag:
    name: Tag the version
    needs: publish
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The first build of each version tags its commit, and later builds of the
      # same version leave the tag where it is. Those are the tags cider links
      # CHANGELOG.md's versions to. Through the API, so nothing is checked out
      # with credentials.
      - name: Tag the first build of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.publish.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already marks an earlier build of this version."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
            echo "Tagged $GITHUB_SHA as $TAG."
          fi
