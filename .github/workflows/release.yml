name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  package:
    name: Signed release artifacts
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'

      - name: Write public deployment configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          LINK_HOST: ${{ vars.LINK_HOST }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_VAPID_KEY: ${{ vars.FCM_VAPID_KEY }}
          ANDROID_FCM_API_KEY: ${{ vars.ANDROID_FCM_API_KEY }}
          ANDROID_FCM_APP_ID: ${{ vars.ANDROID_FCM_APP_ID }}
          WEB_FCM_API_KEY: ${{ vars.WEB_FCM_API_KEY }}
          WEB_FCM_APP_ID: ${{ vars.WEB_FCM_APP_ID }}
        run: |
          jq -n \
            --arg supabaseUrl "$SUPABASE_URL" \
            --arg supabaseKey "$SUPABASE_PUBLISHABLE_KEY" \
            --arg linkHost "$LINK_HOST" \
            --arg googleClient "$GOOGLE_WEB_CLIENT_ID" \
            --arg projectId "$FCM_PROJECT_ID" \
            --arg senderId "$FCM_SENDER_ID" \
            --arg vapid "$FCM_VAPID_KEY" \
            --arg androidKey "$ANDROID_FCM_API_KEY" \
            --arg androidAppId "$ANDROID_FCM_APP_ID" \
            --arg webKey "$WEB_FCM_API_KEY" \
            --arg webAppId "$WEB_FCM_APP_ID" \
            '{
              SUPABASE_URL: $supabaseUrl,
              SUPABASE_PUBLISHABLE_KEY: $supabaseKey,
              LINK_HOST: $linkHost,
              GOOGLE_WEB_CLIENT_ID: $googleClient,
              FCM_PROJECT_ID: $projectId,
              FCM_SENDER_ID: $senderId,
              FCM_VAPID_KEY: $vapid,
              ANDROID_FCM_API_KEY: $androidKey,
              ANDROID_FCM_APP_ID: $androidAppId,
              WEB_FCM_API_KEY: $webKey,
              WEB_FCM_APP_ID: $webAppId
            }' > env/app.json

      - name: Install Android upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/opensplit-upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/opensplit-upload.jks" \
            "$STORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD" > android/key.properties

      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart run tool/verify_config.dart
      - run: dart run tool/build_web.dart
      - run: flutter build appbundle --release --dart-define-from-file=env/app.json

      - uses: actions/upload-artifact@v4
        with:
          name: opensplit-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: opensplit-android-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
