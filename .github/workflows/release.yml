name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy web/backend, changed Play listing and pending app version (uncheck for artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: CI checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and distribute
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    # Do not interrupt uploads or allow overlapping Play/Worker releases.
    concurrency:
      group: opensplit-release-main
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      version: ${{ steps.build.outputs.version }}
      number: ${{ steps.build.outputs.number }}
      app_release: ${{ steps.build.outputs.app_release }}
    env:
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Find the last submitted app release along main's history, even
          # after intervening backend-only merges or failed submissions.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/package.json
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            service_worker/pnpm-lock.yaml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true

      # Before the slow build, so a release that cannot land fails in seconds.
      # Wrangler binds to whatever id the config names without checking it
      # exists, so a deploy to the committed placeholders would succeed, pass
      # the health check below (which touches neither D1 nor KV), and fail on
      # the first real request.
      - name: Refuse to deploy to placeholder resources
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        run: |
          pnpm install --frozen-lockfile
          pnpm check:deploy-config

      - name: Write public app configuration
        env:
          APP_VARIABLES: ${{ toJSON(vars) }}
        # Only these public identifiers enter the client, never the whole env.
        run: |
          printf '%s' "$APP_VARIABLES" | jq '{
            API_BASE_URL, LINK_HOST,
            GOOGLE_WEB_CLIENT_ID, FCM_PROJECT_ID, FCM_SENDER_ID,
            FCM_VAPID_KEY, ANDROID_FCM_API_KEY, ANDROID_FCM_APP_ID,
            WEB_FCM_API_KEY, WEB_FCM_APP_ID
          }' > env/app.json
      - run: flutter pub get --enforce-lockfile
      # One number per deployment. An app release gives the same number to
      # web and Android; other merges only advance the web build number.
      # The version name is pubspec.yaml's, set with cider; see "Versions" in
      # docs/runbook.md.
      - name: Number this build
        id: build
        run: |
          # Run number times 100, plus the attempt: it only ever goes up, and a
          # retry gets a new number, which Play insists on. GitHub numbers runs
          # per workflow file, so renaming this file starts again from 1, below
          # codes Play has already seen; see the runbook before doing that.
          number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( GITHUB_RUN_ATTEMPT > 99 || number > 2100000000 )); then
            echo 'Android version code or retry limit exceeded.' >&2
            exit 1
          fi
          version="$(dart run cider version)"
          test -n "$version"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version ($number)."
          # A tag records a successful Play submission. Keep a bumped version
          # pending across superseding web-only merges and failed uploads.
          git fetch origin --tags
          app_release=true
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            app_release=false
          fi
          if [[ "$app_release" == 'true' ]]; then
            previous_tag="$(git describe --first-parent --tags --abbrev=0 \
              --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD)"
            echo "previous_version=${previous_tag#v}" >> "$GITHUB_OUTPUT"
            echo "Previous submitted app version: ${previous_tag#v}"
          fi
          echo "app_release=$app_release" >> "$GITHUB_OUTPUT"
          build_android=$app_release
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            build_android=true
          fi
          echo "build_android=$build_android" >> "$GITHUB_OUTPUT"
          echo "Android release pending: $app_release"
      - name: Check for Play listing changes
        id: listing
        env:
          GH_TOKEN: ${{ github.token }}
        # Compare actual listing content with the last successful deployment,
        # not the preceding commit: failed or superseded changes stay pending.
        # Artifact-only manual runs never advance this baseline.
        run: |
          baseline="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          changed=true
          if [[ -n "$baseline" ]] && git cat-file -e "$baseline^{commit}"; then
            if git diff --quiet "$baseline" HEAD -- fastlane/metadata/android; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Play listing content changed: $changed"
      - uses: ruby/setup-ruby@v1
        if: steps.build.outputs.build_android == 'true' || steps.listing.outputs.changed == 'true'
        with:
          bundler-cache: true
      # Gradle's downloads are cached, keyed on the Gradle files and wrapper
      # version, so a release does not fetch the whole Android toolchain from
      # Maven Central again. Central rate-limits shared runner addresses, and
      # a 429 there once failed a release before anything was deployed.
      - uses: actions/setup-java@v6
        if: steps.build.outputs.build_android == 'true'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Before the slow build, so a changelog Play would refuse fails in
      # seconds. Package the listing and notes into the runner's temporary
      # directory, leaving the checkout and generated screenshots untouched.
      - name: Prepare the Play listing and release notes
        if: steps.build.outputs.build_android == 'true' || steps.listing.outputs.changed == 'true'
        env:
          BUILD_ANDROID: ${{ steps.build.outputs.build_android }}
        run: |
          flags=()
          if [[ "$BUILD_ANDROID" != 'true' ]]; then flags+=(--listing-only); fi
          dart run tool/play_metadata.dart --output="$RUNNER_TEMP/play-metadata" "${flags[@]}"
      - run: dart run build_runner build
      - name: Build the web bundle
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: dart run tool/build_web.dart --build-number="$BUILD_NUMBER"
      - name: Install Android upload key
        if: steps.build.outputs.build_android == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Upload key is missing}" \
            | base64 --decode > "$RUNNER_TEMP/opensplit-upload.jks"
          test -s "$RUNNER_TEMP/opensplit-upload.jks"
      - name: Build signed Android bundle
        if: steps.build.outputs.build_android == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/opensplit-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          flutter build appbundle --release --dart-define-from-file=env/app.json \
            --build-number="$BUILD_NUMBER" --split-debug-info=build/debug-info/android
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Check packaging did not mutate source
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v7
        with:
          name: opensplit-${{ github.sha }}-${{ github.run_attempt }}
          path: build/web
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.build_android == 'true'
        with:
          name: opensplit-android-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release
            build/debug-info/android
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.build_android == 'true' || steps.listing.outputs.changed == 'true'
        with:
          name: opensplit-play-metadata-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/play-metadata
          if-no-files-found: error
          retention-days: 30

      # Mint short-lived credentials only AFTER builds and artifact uploads.
      - name: Recheck current main before deployment
        if: github.event_name == 'push' || inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      # One step, one version: the Worker script and everything in build/web go
      # up together and become live together. That is the reason the bundle is
      # built in this job rather than deployed from somewhere else. Already open
      # web tabs and installed Android builds can still use an older contract;
      # API retirement and client update handling must account for those.
      #
      # The Worker, the D1 database, the KV namespace and the custom domain all
      # have to exist already; see docs/runbook.md. Creating them is
      # not something a push to main should be able to do.
      #
      # `pnpm exec wrangler`, the version pnpm-lock.yaml pins: the same one CI
      # just ran the suite against. Wrangler owns the Durable Object `exports`
      # map and the D1 migration state, so it is part of what is being released,
      # not a transport.
      #
      # D1 first, then the Worker, so the code never starts against a schema
      # older than it expects. Wrangler applies only what it has not recorded as
      # applied, and confirms by itself outside a terminal. The Durable Objects
      # migrate themselves, lazily, on first open; see docs/runbook.md.
      - name: Apply the D1 migrations
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply opensplit --remote
      - name: Deploy the Worker and the web bundle
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""
      - name: Check the deployment is answering
        if: github.event_name == 'push' || inputs.deploy
        env:
          LINK_HOST: ${{ vars.LINK_HOST }}
        run: |
          # Deploys are eventually consistent across the edge, so this retries
          # rather than asserting once. A release that uploaded and then does
          # not answer is worth failing the run over.
          for attempt in $(seq 1 30); do
            if curl -sf "https://${LINK_HOST:?Link host is missing}/api/health" \
              | grep -q '"service":"opensplit"'; then
              exit 0
            fi
            sleep 4
          done
          echo "The deployed Worker did not answer /api/health." >&2
          exit 1
      - name: Authenticate to Google Play (keyless)
        if: (steps.build.outputs.app_release == 'true' || steps.listing.outputs.changed == 'true') && (github.event_name == 'push' || inputs.deploy)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Submit to Play production
        if: steps.build.outputs.app_release == 'true' && (github.event_name == 'push' || inputs.deploy)
        env:
          # Fastlane derives priority from the Cider version relative to the
          # last submitted tag: major 5, minor 2, patch 0. This also preserves
          # urgency across failed uploads and superseding backend-only merges.
          PLAY_APP_VERSION: ${{ steps.build.outputs.version }}
          PLAY_PREVIOUS_VERSION: ${{ steps.build.outputs.previous_version }}
          PLAY_UPDATE_LISTING: ${{ steps.listing.outputs.changed }}
          # Written above, from CHANGELOG.md, listing copy and committed artwork.
          # en-US is the store listing's language; images affect the listing
          # across tracks. The production lane fixes the destination and full
          # rollout status; Play review and managed publishing still apply.
          PLAY_METADATA_DIR: ${{ runner.temp }}/play-metadata
        run: bundle exec fastlane android production
      - name: Publish the changed Play listing without an app release
        if: steps.build.outputs.app_release == 'false' && steps.listing.outputs.changed == 'true' && (github.event_name == 'push' || inputs.deploy)
        env:
          PLAY_METADATA_DIR: ${{ runner.temp }}/play-metadata
        run: bundle exec fastlane android listing
      - name: Remove temporary upload key
        if: always()
        run: rm -f -- "${RUNNER_TEMP:?}/opensplit-upload.jks"

  # A failed GitHub release must leave the successful Play submission tagged.
  tag:
    name: Tag the version
    needs: publish
    if: (github.event_name == 'push' || inputs.deploy) && needs.publish.outputs.app_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      # The first build of each version tags its commit, and later builds of the
      # same version leave the tag where it is. Those are the tags cider links
      # CHANGELOG.md's versions to. Through the API, so nothing is checked out
      # with credentials.
      - name: Tag the first build of this version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.publish.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already marks an earlier build of this version."
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
            echo "Tagged $GITHUB_SHA as $TAG."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  github_release:
    name: Publish Android APK on GitHub
    needs: [publish, tag]
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: opensplit-github-release-${{ needs.publish.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
      PLAY_VERSION_CODE: ${{ needs.publish.outputs.number }}
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Authenticate to Google Play (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Download the Play-signed universal APK
        run: |
          for attempt in {1..4}; do
            if bundle exec fastlane run download_universal_apk_from_google_play \
              package_name:com.eigeninteractive.opensplit \
              version_code:"$PLAY_VERSION_CODE" \
              json_key:"$GOOGLE_APPLICATION_CREDENTIALS" \
              destination:"$RUNNER_TEMP/opensplit-$RELEASE_VERSION-android.apk"; then
              exit 0
            fi
            if (( attempt < 4 )); then
              echo "APK download attempt $attempt failed. Retrying in 60 seconds."
              sleep 60
            fi
          done
          echo "Could not download the Play-signed APK after four attempts." >&2
          exit 1
      - name: Verify and publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$RELEASE_VERSION"
          apk="opensplit-$RELEASE_VERSION-android.apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          "$tools/apksigner" verify "$RUNNER_TEMP/$apk"
          badging="$("$tools/aapt2" dump badging "$RUNNER_TEMP/$apk")"
          grep -Fq "package: name='com.eigeninteractive.opensplit' versionCode='$PLAY_VERSION_CODE' versionName='$RELEASE_VERSION'" \
            <<< "$badging" || { echo "The APK package or version does not match $tag." >&2; exit 1; }
          dart run cider describe "$RELEASE_VERSION" --only-body > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          cd "$RUNNER_TEMP"
          sha256sum "$apk" > "$apk.sha256"
          jq -cn --arg versionName "$RELEASE_VERSION" --argjson versionCode "$PLAY_VERSION_CODE" \
            '{versionName: $versionName, versionCode: $versionCode}' > version.json
          assets=("$apk" "$apk.sha256" version.json)

          if release="$(gh release view "$tag" --json isDraft,assets 2>release-error.txt)"; then
            if jq -e '.isDraft' <<< "$release" >/dev/null; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --draft=false --verify-tag
            else
              for asset in "${assets[@]}"; do
                digest="$(sha256sum "$asset" | cut -d ' ' -f 1)"
                jq -e --arg name "$asset" --arg digest "sha256:$digest" \
                  'any(.assets[]; .name == $name and .digest == $digest)' \
                  <<< "$release" >/dev/null || {
                    echo "Published $tag has a missing or different $asset." >&2
                    exit 1
                  }
              done
            fi
          elif grep -Fxq 'release not found' release-error.txt; then
            gh release create "$tag" "${assets[@]}" --verify-tag \
              --title "OpenSplit $RELEASE_VERSION" --notes-file release-notes.md
          else
            cat release-error.txt >&2
            exit 1
          fi
