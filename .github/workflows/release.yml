name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Cloudflare and Play (uncheck for first-upload artifacts only)
        type: boolean
        default: false
      update_priority:
        description: >-
          Play in-app update priority, 0-5. 0 updates quietly in the
          background; 4 and up interrupt testers with a blocking update they
          cannot dismiss. Use 4 only when the server can no longer talk to the
          version being replaced.
        type: choice
        default: "0"
        options: ["0", "1", "2", "3", "4", "5"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: CI checks
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and distribute
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    # Do not interrupt uploads or allow overlapping Play/Worker releases.
    concurrency:
      group: opensplit-release-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BUNDLE_FROZEN: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          cache: true

      - name: Write public app configuration
        env:
          APP_VARIABLES: ${{ toJSON(vars) }}
        # Only these public identifiers enter the client, never the whole env.
        run: |
          printf '%s' "$APP_VARIABLES" | jq '{
            API_BASE_URL, LINK_HOST,
            GOOGLE_WEB_CLIENT_ID, FCM_PROJECT_ID, FCM_SENDER_ID,
            FCM_VAPID_KEY, ANDROID_FCM_API_KEY, ANDROID_FCM_APP_ID,
            WEB_FCM_API_KEY, WEB_FCM_APP_ID
          }' > env/app.json
      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build
      - run: dart run tool/build_web.dart
      - name: Install Android upload key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Upload key is missing}" \
            | base64 --decode > "$RUNNER_TEMP/opensplit-upload.jks"
          test -s "$RUNNER_TEMP/opensplit-upload.jks"
      - name: Build signed Android bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/opensplit-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          # Reserve two digits for retries so every attempt gets a new code.
          version_code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if (( GITHUB_RUN_ATTEMPT > 99 || version_code > 2100000000 )); then
            echo 'Android version code or retry limit exceeded.' >&2
            exit 1
          fi
          flutter build appbundle --release --dart-define-from-file=env/app.json \
            --build-number="$version_code" --split-debug-info=build/debug-info/android
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Check packaging did not mutate source
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v7
        with:
          name: opensplit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/web
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release
            build/debug-info/android
          if-no-files-found: error
          retention-days: 30

      # Mint short-lived credentials only AFTER builds and artifact uploads.
      - name: Recheck current main before deployment
        if: github.event_name == 'push' || inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      # One step, one version: the Worker script and everything in build/web go
      # up together and become live together. That is the reason the bundle is
      # built in this job rather than deployed from somewhere else — a front end
      # that can be newer or older than the API it talks to is a class of bug
      # this arrangement simply does not have.
      #
      # The Worker, the D1 database, the KV namespace and the custom domain all
      # have to exist already; see docs/runbook.md. Creating them is
      # not something a push to main should be able to do.
      #
      # `npx wrangler` against the pinned devDependency rather than
      # cloudflare/wrangler-action, which installs "a default version" when it
      # cannot find one. Wrangler is not a transport here: it owns the Durable
      # Object `exports` map and the D1 migration state, so the version that
      # deploys should be the version CI just ran the suite against, and
      # package-lock.json is the only thing that guarantees that.
      - name: Deploy the Worker and the web bundle
        if: github.event_name == 'push' || inputs.deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy
      - name: Check the deployment is answering
        if: github.event_name == 'push' || inputs.deploy
        env:
          LINK_HOST: ${{ vars.LINK_HOST }}
        run: |
          # Deploys are eventually consistent across the edge, so this retries
          # rather than asserting once. A release that uploaded and then does
          # not answer is worth failing the run over.
          for attempt in $(seq 1 30); do
            if curl -sf "https://${LINK_HOST:?Link host is missing}/api/health" \
              | grep -q '"service":"opensplit"'; then
              exit 0
            fi
            sleep 4
          done
          echo "The deployed Worker did not answer /api/health." >&2
          exit 1
      - name: Authenticate to Google Play (keyless)
        if: github.event_name == 'push' || inputs.deploy
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Distribute to Play closed testing
        if: github.event_name == 'push' || inputs.deploy
        env:
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          # Google's default closed track is still called "alpha" in the
          # Publishing API. Set the PLAY_TRACK repository variable if this
          # project's closed track was created by hand and carries its own name.
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          # Play's 0-5 in-app update priority, set per release and only
          # settable through the Publishing API. 0 is an ordinary background
          # update; 4 and up interrupt testers with a blocking flow, which is
          # for a build the server can no longer talk to an older client from.
          PLAY_UPDATE_PRIORITY: ${{ inputs.update_priority || vars.PLAY_UPDATE_PRIORITY || '0' }}
        run: bundle exec fastlane android closed
      - name: Remove temporary upload key
        if: always()
        run: rm -f -- "${RUNNER_TEMP:?}/opensplit-upload.jks"
