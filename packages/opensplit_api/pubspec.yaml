# Hand-owned, and listed in .openapi-generator-ignore so regeneration leaves it
# alone. Everything else in this package is generated wholesale.
#
# Owned because the template's version of this file makes three claims this
# repository cannot stand behind:
#
#   * `sdk: '>=2.17.0 <4.0.0'`, which is a compatibility promise nothing here
#     tests. This package is only ever resolved by the app above it, whose
#     floor is the one that matters.
#   * a `test` dev-dependency pinned to `>=1.21.6 <1.22.0`, for generated tests
#     this repository does not generate.
#   * `description` written into a single-quoted YAML scalar with no escaping,
#     so an apostrophe produces a manifest pub cannot parse.

name: opensplit_api
description: >-
  The OpenSplit API client, generated from docs/openapi.json by
  tool/generate_api_client.dart. A build artefact of the wire contract, not a
  hand-written library — see the server's schemas for the source of truth.
version: 1.0.0
homepage: https://github.com/eigeninteractive/opensplit
repository: https://github.com/eigeninteractive/opensplit/tree/main/packages/opensplit_api
issue_tracker: https://github.com/eigeninteractive/opensplit/issues
publish_to: none

environment:
  # The app's floor. This package is a path dependency of exactly one thing and
  # is never published, so claiming a wider range would be claiming support for
  # SDKs nothing ever resolves it against.
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.0
  http: ^1.6.0
  intl: ^0.20.3
  meta: ^1.16.0
