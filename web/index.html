<!doctype html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Split expenses with friends. Free forever, open source, no ads, works offline.">

    <!-- ColorScheme.surface, the colour the app bar and the page both sit on.
       Anything else here shows as a seam between the browser chrome and the
       first pixel of the app. -->
    <meta name="theme-color" content="#fcf8ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="OpenSplit">
    <link rel="apple-touch-icon" href="/icons/Icon-192.png">
    <!-- The mark is a ring with one diagonal knockout, which is four shapes of
       vector and blurs into a smudge as a 32px bitmap. SVG first, so any
       browser that takes it renders it sharp at whatever size the tab is. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">

    <!-- Exactly what Flutter sets through MaterialApp.onGenerateTitle once it
       boots, and pinned to it by a test. Anything else here is a tab title
       that visibly rewrites itself a second into every cold start. -->
    <title>OpenSplit</title>
    <link rel="manifest" href="manifest.json">

    <!-- Not a page, and not a search result. Everything under /app returns this
       one shell, so left to itself it would offer the index an unbounded set
       of URLs that are all the same document and all competing with the
       landing page. noindex rather than a robots.txt Disallow on purpose:
       a disallowed URL is never fetched, so the rule that would keep it out
       of the index is never read, and a page linked from the landing page can
       still be listed with no snippet at all. This is read, and obeyed. -->
    <meta name="robots" content="noindex">

    <!-- The app's own link is shared as often as the landing page's, and had
       nothing to unfurl with. Same card as the landing page, deliberately:
       whichever of the two somebody pastes, it is the same product. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OpenSplit">
    <meta property="og:title" content="OpenSplit · Free, open-source expense splitting">
    <meta property="og:description" content="Split expenses with friends, free forever. Open source, with no ads and no tracking. Works offline, in any currency.">
    <meta property="og:url" content="https://opensplit.eigeninteractive.com/">
    <meta property="og:image" content="https://opensplit.eigeninteractive.com/store/og-card.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="OpenSplit: split expenses with friends, free forever. Beside it, the app showing a trip's balances.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OpenSplit · Free, open-source expense splitting">
    <meta name="twitter:description" content="Split expenses with friends, free forever. Open source, with no ads and no tracking. Works offline, in any currency.">
    <meta name="twitter:image" content="https://opensplit.eigeninteractive.com/store/og-card.png">
    <meta name="twitter:image:alt" content="OpenSplit: split expenses with friends, free forever. Beside it, the app showing a trip's balances.">

    <style>
    /* A splash, matching Android's: the mark, alone, on the colour the app
     * paints its first frame in. It stays up until Flutter has a screen with
     * real data on it (see lib/presentation/launch_hold.dart), so a launch is
     * one wait, not a loader followed by placeholders followed by content.
     *
     * The colours are literals because this has to paint on the first round
     * trip, before any script runs. test/presentation/theme_test.dart compares
     * them against the running theme, so the two cannot drift. */
    :root {
      --surface: #fcf8ff; /* ColorScheme.surface */
      --primary: #5b5891; /* the brand mark */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #131318;
        --primary: #c4c0ff;
      }
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--surface);
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
    }
    #splash .mark {
      width: 72px;
      height: 72px;
      color: var(--primary);
    }
    #splash.done {
      opacity: 0;
      transition: opacity 180ms ease-out;
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      #splash.done {
        transition: none;
      }
    }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <mask id="slash">
          <rect width="48" height="48" fill="#fff"></rect>
          <rect x="20.75" y="-4" width="6.5" height="56" fill="#000" transform="rotate(24 24 24)"></rect>
        </mask>
        <circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="6.5" mask="url(#slash)"></circle>
      </svg>
    </div>

    <noscript>
      <p style="padding:24px">OpenSplit needs JavaScript. The Android app does not.</p>
    </noscript>

    <script>
    // Flutter fires this once it has actually painted, so the swap happens
    // when there is something real underneath rather than on a timer that
    // guesses.
    window.addEventListener("flutter-first-frame", () => {
      var splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("done");
      setTimeout(() => {
        splash.remove();
      }, 200);
    });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
