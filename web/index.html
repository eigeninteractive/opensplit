<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Split expenses with friends. Free forever, no ads, works offline, open source.">

  <!-- ColorScheme.surface, the colour the app bar and the page both sit on.
       Anything else here shows as a seam between the browser chrome and the
       first pixel of the app. -->
  <meta name="theme-color" content="#fcf8ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenSplit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- The mark is a ring with one diagonal knockout, which is four shapes of
       vector and blurs into a smudge as a 32px bitmap. SVG first, so any
       browser that takes it renders it sharp at whatever size the tab is. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>OpenSplit — split expenses with friends</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* A real skeleton, not a spinner.
     *
     * The gap before the first frame is the worst impression the app makes,
     * and on the web it is unavoidable — the engine has to download. A blank
     * white page reads as broken; a spinner reads as slow. A layout that
     * matches what is about to appear reads as loading, and the swap is barely
     * perceptible because nothing moves.
     *
     * Every value below is a Material 3 one, taken from the same place the app
     * takes it: the tones of ColorScheme.fromSeed(#00695C), the sizes of the
     * M3 components, the metrics of the Roboto text styles. They are written
     * out as literals because this has to paint on the first round trip,
     * before any stylesheet or script is fetched — and they are pinned by a
     * test (test/presentation/theme_test.dart) that reads this file and
     * compares it against the running theme, so the two cannot drift.
     *
     * Anything the app shows that is genuinely constant — the title, the
     * button's label, the shape and colour of every container — is drawn
     * exactly. Only the parts that are still unknown are drawn as placeholders.
     */
    :root {
      --surface: #fcf8ff;              /* ColorScheme.surface */
      --placeholder: #e5e1e9;          /* ColorScheme.surfaceContainerHighest */
      --outline-variant: #c8c5d0;      /* the Card border, and dividers */
      --on-surface: #1c1b21;           /* the app bar title */
      --secondary-container: #e3e0f9;  /* the group avatar */
      --primary-container: #e3dfff;    /* the extended FAB */
      --on-primary-container: #434078;
      --primary: #5b5891;             /* the brand mark */
      --on-surface-variant: #47464f; /* the unselected rail label */
      --surface-container: #f0ecf4;    /* the navigation bar */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #131318;
        --placeholder: #35343a;
        --outline-variant: #47464f;
        --on-surface: #e5e1e9;
        --secondary-container: #464559;
        --primary-container: #434078;
        --on-primary-container: #e3dfff;
        --primary: #c4c0ff;
        --on-surface-variant: #c8c5d0;
        --surface-container: #201f25;
      }
    }

    html, body { margin: 0; padding: 0; height: 100%; background: var(--surface); }
    body {
      /* The app's own face first, so that a warm cache matches it exactly; the
       * system face only stands in for the first paint of a first visit.
       * Bundled, not fetched — see the `fonts:` block in pubspec.yaml. */
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--on-surface);
    }

    #skeleton { position: fixed; inset: 0; z-index: 1; }

    /* The small top app bar: 56dp, on `surface`, and flat. M3 gave up the
     * bottom rule and the drop shadow — an app bar only separates itself from
     * the content when something scrolls under it, and then by changing tone,
     * not by drawing a line. */
    .bar {
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 16px;
      background: var(--surface);
    }
    /* textTheme.titleLarge: Roboto 22/28, regular, no tracking. */
    .bar h1 {
      margin: 0;
      flex: 1;
      font-size: 22px;
      line-height: 28px;
      font-weight: 400;
      letter-spacing: 0;
    }
    /* The mark, at the size BrandLockup works out: titleLarge is 22px, the
     * mark's box is a little over 1.5x that, and the clear space beside it is
     * the ratio measured off the designer's horizontal lockup. Inlined rather
     * than linked so it paints on the first round trip, like everything else
     * here — an <img> would also be a second request, and could not be tinted.
     * See lib/presentation/widgets/brand_mark.dart. */
    .bar .mark { width: 35px; height: 35px; flex: none; margin-right: 7.5px; color: var(--primary); }

    /* ListView(padding: fromLTRB(16, 8, 16, 96)) inside PageBody(maxWidth: 760).
     *
     * border-box because PageBody caps the whole scroll view at 760, padding
     * included — the default content-box would cap the cards at 760 and hand
     * them 32 more, which is only visible once the screen is wide enough for
     * the cap to bind at all. */
    .list {
      box-sizing: border-box;
      max-width: 760px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* `display: flex` above outranks the user-agent rule for [hidden], so the
     * attribute needs saying again here to actually hide anything. */
    .list[hidden] { display: none; }

    /* Card.outlined: elevation 0, 12dp radius, a hairline in outlineVariant,
     * and a container the same colour as the page — the outline is the whole
     * boundary. Contents are Padding(all: 16) around a Row with a 16dp gap.
     *
     * The padding is 15 rather than 16 because Flutter strokes a shape's
     * border on the inside — an 80dp card stays 80dp — whereas CSS lays the
     * border outside the padding box. 1 + 15 puts the contents at the same
     * 16dp inset and keeps the card the same height, which matters by the
     * third row, where two pixels a card have become six. */
    .card {
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    /* CircleAvatar's default 40dp, already the right colour — there is no
     * version of this row without one, so it is not a placeholder. */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--secondary-container); flex: none;
    }
    /* 48dp: a titleMedium line box (24) + 4 + a bodyMedium one (20). The bars
     * sit where the text will, so the card does not resize under the swap. */
    .lines { flex: 1; height: 48px; }
    .line { border-radius: 4px; background: var(--placeholder); }
    .line.title { height: 16px; margin-top: 4px; width: 62%; }
    .line.detail { height: 12px; margin-top: 11px; width: 40%; }
    .card:nth-child(2) .line.title { width: 44%; }
    .card:nth-child(2) .line.detail { width: 56%; }
    .card:nth-child(3) .line.title { width: 55%; }

    /* FloatingActionButton.extended, 16dp clear of both edges: 56dp tall,
     * 16dp radius, on primaryContainer, padded 16 before the icon and 20 after
     * the label, with 8 between them. The label is real; only the icon is
     * standing in, so the button is already its final width. */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px 0 16px;
      border-radius: 16px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      /* Material's elevation 6, the extended FAB's resting shadow. */
      box-shadow: 0 3px 5px -1px rgba(0,0,0,.20),
                  0 6px 10px 0 rgba(0,0,0,.14),
                  0 1px 18px 0 rgba(0,0,0,.12);
    }
    .fab .icon { width: 24px; height: 24px; border-radius: 4px; background: currentColor; opacity: .35; }
    /* textTheme.labelLarge. */
    .fab .label { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; }

    /* At 840px — Material's medium-to-expanded boundary, and _railBreakpoint
     * in router.dart — the app puts a NavigationRail on the left: 80dp of rail
     * and then a 1dp divider.
     *
     * The rail is drawn here too, not just left as a gap. It used to be an
     * empty 80dp column that filled with two destinations the moment Flutter
     * painted, which is the one part of this screen that visibly appeared out
     * of nothing.
     *
     * Every offset below is measured off the running app rather than derived:
     * the selected indicator occupies y 8-40, its label's cap height sits at
     * 48-57, the second destination's icon at 76-100 and its label at 111-121.
     */
    .rail { display: none; }

    @media (min-width: 840px) {
      #skeleton { padding-left: 81px; }
      #skeleton::before {
        content: '';
        position: fixed;
        left: 80px; top: 0; bottom: 0;
        width: 1px;
        background: var(--outline-variant);
      }

      .rail { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 80px; }
      .rail > * { position: absolute; left: 0; width: 80px; text-align: center; }

      /* The selected destination's indicator: 56x32 on secondaryContainer,
       * which is exactly what the app draws and needs no placeholder. */
      .rail .pill {
        top: 8px; height: 32px; width: 56px; left: 12px;
        border-radius: 16px; background: var(--secondary-container);
      }
      /* textTheme.labelMedium, the rail's label style. The words are real. */
      .rail .label {
        font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px;
      }
      .rail .selected { top: 44px; color: var(--on-surface); }
      .rail .u1 { top: 108px; color: var(--on-surface-variant); }
      .rail .u2 { top: 172px; color: var(--on-surface-variant); }

      /* Only the glyphs stand in; the labels are the real words. */
      .rail .glyph {
        width: 24px; height: 24px; left: 28px; border-radius: 4px;
        background: var(--placeholder);
      }
      .rail .g1 { top: 12px; }
      .rail .g2 { top: 76px; }
      .rail .g3 { top: 140px; }
    }

    /* Below the rail breakpoint the same three destinations are a
     * NavigationBar along the bottom: 80dp tall on surfaceContainer, each
     * destination a 64x32 indicator on secondaryContainer with a labelMedium
     * beneath it. Drawn here for the same reason the rail is — it is chrome
     * that is on screen from the first frame of the real app, so leaving a
     * gap where it goes is the one thing that visibly pops into place. */
    .nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; height: 80px;
           background: var(--surface-container); }
    .nav > div { flex: 1; position: relative; }
    .nav .pill {
      position: absolute; top: 12px; left: 50%; margin-left: -32px;
      width: 64px; height: 32px; border-radius: 16px;
      background: var(--secondary-container);
    }
    .nav .glyph {
      position: absolute; top: 16px; left: 50%; margin-left: -12px;
      width: 24px; height: 24px; border-radius: 4px; background: var(--placeholder);
    }
    /* textTheme.labelMedium, the navigation bar's label style. */
    .nav .label {
      position: absolute; top: 48px; left: 0; right: 0; text-align: center;
      font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px;
      color: var(--on-surface-variant);
    }
    .nav .selected .label { color: var(--on-surface); }

    @media (min-width: 840px) { .nav { display: none; } }
    /* The FAB clears the bar rather than sitting on it: 16dp above 80dp. */
    @media (max-width: 839px) { .fab { bottom: 96px; } }

    /* One slow pulse, on the placeholders only. Pulsing the card would fade
     * its border and its avatar, which are not placeholders at all — they are
     * already exactly what the app is about to draw. */
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .line { animation: breathe 1.8s ease-in-out infinite; }
    .card:nth-child(2) .line { animation-delay: 0.15s; }
    .card:nth-child(3) .line { animation-delay: 0.3s; }

    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      #skeleton.done { transition: none; }
    }

    #skeleton.done { opacity: 0; transition: opacity 180ms ease-out; pointer-events: none; }
  </style>
</head>
<body>
  <div id="skeleton" aria-hidden="true">
    <div class="rail">
      <div class="pill"></div>
      <div class="glyph g1"></div>
      <div class="label selected">Groups</div>
      <div class="glyph g2"></div>
      <div class="label u1">Account</div>
      <div class="glyph g3"></div>
      <div class="label u2">Settings</div>
    </div>
    <div class="bar">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
        <mask id="slash">
          <rect width="48" height="48" fill="#fff"></rect>
          <rect x="20.75" y="-4" width="6.5" height="56" fill="#000" transform="rotate(24 24 24)"></rect>
        </mask>
        <circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="6.5" mask="url(#slash)"></circle>
      </svg>
      <h1>OpenSplit</h1>
    </div>
    <div class="list" id="cards" hidden>
      <div class="card">
        <div class="avatar"></div>
        <div class="lines"><div class="line title"></div><div class="line detail"></div></div>
      </div>
      <div class="card">
        <div class="avatar"></div>
        <div class="lines"><div class="line title"></div><div class="line detail"></div></div>
      </div>
      <div class="card">
        <div class="avatar"></div>
        <div class="lines"><div class="line title"></div><div class="line detail"></div></div>
      </div>
    </div>
    <div class="fab">
      <div class="icon"></div>
      <div class="label">New group</div>
    </div>
    <div class="nav">
      <div class="selected">
        <div class="pill"></div>
        <div class="glyph"></div>
        <div class="label">Groups</div>
      </div>
      <div>
        <div class="glyph"></div>
        <div class="label">Account</div>
      </div>
      <div>
        <div class="glyph"></div>
        <div class="label">Settings</div>
      </div>
    </div>
  </div>

  <noscript>
    <p style="padding:24px">OpenSplit needs JavaScript. The Android app does not.</p>
  </noscript>

  <script>
    // Placeholder cards are a promise that content is coming, and for a
    // first-time visitor that promise is false: they have no groups, so the app
    // opens on "No groups yet". They are also the ones who wait longest, with
    // nothing cached — so the cards were least truthful exactly when they were
    // most visible.
    //
    // The app leaves a note in localStorage (see lib/data/web/boot_hint.dart)
    // once it knows. Only a browser that has seen groups here gets cards; every
    // other case falls back to the app bar and the button, which are on this
    // screen for everybody in every state.
    //
    // Read synchronously, before first paint, so nothing moves afterwards.
    // Wrapped because reading storage throws outright in some privacy modes.
    try {
      if (localStorage.getItem('opensplit.hasGroups') === '1') {
        document.getElementById('cards').hidden = false;
      }
    } catch (e) { /* chrome only, which is the safe default */ }

    // Flutter fires this once it has actually painted, so the swap happens
    // when there is something real underneath rather than on a timer that
    // guesses.
    window.addEventListener('flutter-first-frame', function () {
      var skeleton = document.getElementById('skeleton');
      if (!skeleton) return;
      skeleton.classList.add('done');
      setTimeout(function () { skeleton.remove(); }, 200);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
